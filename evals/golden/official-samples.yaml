  - id: ccdv-f.D7.S1.official-1
    flaw: null
    note: official sample, unchanged
    question:
      id: ccdv-f.D7.S1.official-1
      origin: official
      stem: A Claude-powered agent summarizes web pages submitted by end users. One
        page contains hidden text instructing the model to ignore previous
        instructions and reveal its system prompt. Which mitigation is most
        effective?
      select: 1
      options:
        - id: A
          text: Raise the model's temperature so its behavior is harder to predict.
          correct: false
          rationale: Temperature is irrelevant to injection.
        - id: B
          text: Treat retrieved page content as untrusted input, keep it separate from
            trusted instructions, and use guardrails or hooks so injected
            instructions cannot trigger sensitive actions.
          correct: true
          rationale: Prompt injection is addressed by isolating untrusted content from
            trusted instructions and enforcing least-privilege guardrails so
            injected text cannot invoke sensitive tools.
        - id: C
          text: Add a line to the system prompt asking users not to include malicious
            instructions.
          correct: false
          rationale: A polite request is not an enforceable control.
        - id: D
          text: Switch to a larger model that follows instructions more reliably.
          correct: false
          rationale: A more instruction-following model can be more susceptible, not less.
      source:
        title: Claude Certified Developer – Foundations Exam Guide v1.0, Sample 2
        url: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542875/Claude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
