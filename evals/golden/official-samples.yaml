  - id: ccdv-f.D8.S3.official-1
    flaw: null
    note: official sample, unchanged
    question:
      id: ccdv-f.D8.S3.official-1
      origin: official
      stem: A team needs Claude to call an internal inventory service exposed as a
        REST API. They want the capability to be reusable across several Claude
        applications and maintained independently of any one app. Which approach
        best fits?
      select: 1
      options:
        - id: A
          text: Hard-code the inventory logic into each application's system prompt.
          correct: false
          rationale: Hard-coding logic into prompts is neither reusable nor maintainable.
        - id: B
          text: Build an MCP server that exposes the inventory operations as tools so
            multiple Claude applications can connect to it.
          correct: true
          rationale: An MCP server exposes reusable tools that multiple Claude
            applications can share and that can be maintained independently.
        - id: C
          text: Paste the current inventory data into the context window on every request.
          correct: false
          rationale: Pasting data gives no live access and wastes context.
        - id: D
          text: Rely on a built-in tool, since built-in tools can reach any internal REST
            API.
          correct: false
          rationale: Built-in tools do not automatically reach arbitrary internal APIs.
      source:
        title: Claude Certified Developer – Foundations Exam Guide v1.0, Sample 3
        url: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542875/Claude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
