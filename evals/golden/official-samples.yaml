# MF-0008 golden set (SC-4): the 3 official exam-guide samples and one planted variant per flaw.
# The verifier must name every wrong-key and at least 80% of the other flaws (MF-0022 runs it for real).
# Coder F adds ~30 hand-written cases in further files here.
cases:
  - id: ccdv-f.D2.S3.official-1
    flaw: null
    note: official sample, unchanged
    question:
      id: ccdv-f.D2.S3.official-1
      origin: official
      stem: A developer must process 10,000 documents overnight to produce a
        non-urgent analytics report. Cost is the primary concern, and results
        are not needed until the following morning. Which approach best fits the
        requirement?
      select: 1
      options:
        - id: A
          text: Send every request synchronously through the Messages API in parallel to
            finish as quickly as possible.
          correct: false
          rationale: Sending requests synchronously in parallel does not reduce per-token
            cost.
        - id: B
          text: Use the Message Batches API, which processes large asynchronous workloads
            within a 24-hour window at reduced cost.
          correct: true
          rationale: The Message Batches API is designed for latency-tolerant, high-volume
            workloads at lower cost, which matches an overnight, non-urgent job.
        - id: C
          text: Lower max_tokens on synchronous calls to minimize cost.
          correct: false
          rationale: Lowering max_tokens does not address the batch-versus-realtime
            tradeoff.
        - id: D
          text: Switch to the smallest available model regardless of output quality.
          correct: false
          rationale: Blindly downsizing the model does not address the
            batch-versus-realtime tradeoff.
      source:
        title: Claude Certified Developer – Foundations Exam Guide v1.0, Sample 1
        url: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542875/Claude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
      skill: D2.S3
