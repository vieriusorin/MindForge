cuckoos:
  - id: ccdv-f.D6.S1.cuckoo-subagent-context
    # grounded: only — "the subagent does that work in its own context and returns only the summary"
    # grounded: only — line 4 is advice to the reader (scope each subagent's tools), not a doc claim
    # example-name: explorer
    title: A team's CLAUDE.md notes on using subagents
    origin: ai
    author: sorin.vieriu@ddroidd.com
    generatedBy:
      model: claude-opus-5-5
      prompt: mf0016-hand-session
    snippetKind: prompt
    lines:
      - "## Subagents"
      - "- Send broad searches to the `explorer` subagent; only its summary comes back."
      - "- A subagent sees the whole main conversation, so its prompt never needs to restate the
        task."
      - "- Give each subagent only the tools it needs (`tools:` in its frontmatter)."
      - "- Ask for file paths and line numbers in the summary, not file dumps."
    flawLine: 3
    flawKind: false-claim
    explanation: Unless it is a fork, a subagent runs in its own context window, starting fresh. It sees
      its own system prompt and the prompt the main agent writes for it, not the main conversation.
      That isolation keeps the main thread clean, but it also means the delegating prompt must state
      the task and the context the subagent needs.
    sources:
      - https://code.claude.com/docs/en/sub-agents
  - id: ccdv-f.D6.S1.cuckoo-keep-every-tool-result
    title: The context policy in a long-running research agent's system prompt
    origin: ai
    author: sorin.vieriu@ddroidd.com
    generatedBy:
      model: claude-opus-5-5
      prompt: mf0016-hand-session
    snippetKind: prompt
    lines:
      - "Context policy:"
      - 1. Keep a running NOTES.md with decisions and open questions; re-read it after a reset.
      - 2. Fetch files when you need them; keep paths, not contents, in your notes.
      - "3. Never clear old tool results: the more tokens in context, the more accurate you become."
      - 4. When the history nears the limit, summarise it and continue from the summary.
    flawLine: 4
    flawKind: false-claim
    explanation: More context is not more accuracy. As the window fills, recall of any one detail
      degrades (context rot), so context is a finite budget to spend on the smallest set of
      high-signal tokens. Clearing old raw tool results, once they have been acted on, is one of the
      lightest and safest forms of compaction.
    sources:
      - https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
