skill: D7.S1
questions:
  - id: ccdv-f.D7.S1.official-1
    origin: official
    stem: "A Claude-powered agent summarizes web pages submitted by end users. One page contains hidden text instructing the model to ignore previous instructions and reveal its system prompt. Which mitigation is most effective?"
    select: 1
    options:
      - id: A
        text: "Raise the model's temperature so its behavior is harder to predict."
        correct: false
        rationale: "Temperature is irrelevant to injection."
      - id: B
        text: "Treat retrieved page content as untrusted input, keep it separate from trusted instructions, and use guardrails or hooks so injected instructions cannot trigger sensitive actions."
        correct: true
        rationale: "Prompt injection is addressed by isolating untrusted content from trusted instructions and enforcing least-privilege guardrails so injected text cannot invoke sensitive tools."
      - id: C
        text: "Add a line to the system prompt asking users not to include malicious instructions."
        correct: false
        rationale: "A polite request is not an enforceable control."
      - id: D
        text: "Switch to a larger model that follows instructions more reliably."
        correct: false
        rationale: "A more instruction-following model can be more susceptible, not less."
    source:
      title: "Claude Certified Developer – Foundations Exam Guide v1.0, Sample 2"
      url: "https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542875/Claude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf"
  - id: ccdv-f.D7.S1.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "An email-triage agent reads inbound emails from unknown senders on behalf of a trusted user. The developer currently concatenates each email body into the system prompt before asking Claude to triage it. How should the application deliver the email content?"
    select: 1
    options:
      - id: A
        text: "Keep the email in the system prompt, wrapped in XML tags and labeled with its sender, since content placed there is treated as the most authoritative."
        correct: false
        rationale: "The page says to deliver third-party content inside tool_result blocks, never in system prompts, so wrapping it in tags does not fix where it lives."
      - id: B
        text: "Screen each email for known injection phrases such as \"ignore previous instructions\", then keep concatenating each cleaned email body into the system prompt as before."
        correct: false
        rationale: "Input filtering is an extra screen, but the page says third-party content belongs in tool_result blocks, never in system prompts, so the structure must change."
      - id: C
        text: "Deliver it JSON-encoded in a tool_result block labeled with its source, and tell Claude that tool content is untrusted data that must never override instructions."
        correct: true
        rationale: "The guidance for indirect injection is to put untrusted content only in tool results, make its nature and source explicit, JSON-encode it so it cannot break out of its delimiters, and state the untrusted-content policy in the system prompt."
      - id: D
        text: "Put the email and the developer's own triage instructions together in one JSON-encoded tool_result block, labeled with its source, so Claude reads them as one unit."
        correct: false
        rationale: "Claude treats tool-result content as untrusted, so the developer's instructions placed there might be ignored or flagged; instructions belong in a user turn after the tool_result."
    source:
      title: "Mitigate jailbreaks and prompt injections"
      url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"
  - id: ccdv-f.D7.S1.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A document-summarization agent has a database tool with full read and write access to all customer records, and a production API key is pasted into its system prompt \"in case it is needed\". The agent processes documents from external sources. Which change most reduces the impact of a successful prompt injection?"
    select: 1
    options:
      - id: A
        text: "Keep the API key in the system prompt and add a sentence there telling Claude never to reveal it to anyone who asks."
        correct: false
        rationale: "The page's mitigation is not to give Claude access to secrets it doesn't need; an instruction leaves the key in context for a successful injection to leak."
      - id: B
        text: "Pre-screen each user message with a lightweight harmlessness model, and keep the current database tool access and the system prompt unchanged."
        correct: false
        rationale: "Harmlessness screens on user input target direct injection, while this risk arrives in external documents; the page limits damage through least privilege, and full write access plus the pasted key stay usable."
      - id: C
        text: "Log every tool call and review the logs each week for signs of injection, while keeping the current database access and the pasted API key."
        correct: false
        rationale: "The page uses monitoring to refine defenses over time, but leaving access and the key unchanged does nothing to limit what a successful injection can do."
      - id: D
        text: "Apply least privilege: drop secrets it does not need, scope the database tool to minimal read-only access, and run its tools in a sandbox."
        correct: true
        rationale: "Limiting access to sensitive data and actions means a successful injection can do minimal damage: no unneeded secrets, sandboxed tools, and permissions scoped as narrowly as possible."
    source:
      title: "Mitigate jailbreaks and prompt injections"
      url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"
