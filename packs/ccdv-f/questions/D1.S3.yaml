skill: D1.S3
questions:
  - id: ccdv-f.D1.S3.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A developer adopted a multi-agent framework for a simple retrieval-plus-answer feature. When outputs go wrong, the team struggles to see which prompts and responses the framework actually sent to the model. What should the developer do?"
    select: 1
    options:
      - id: A
        text: "Add another framework layer on top that logs the agent's high-level decisions, since that summary exposes the prompts and responses sent underneath."
        correct: false
        rationale: "Extra layers of abstraction obscure the underlying prompts and responses rather than exposing them, which makes failures harder to debug."
      - id: B
        text: "Keep the framework but add a gate check between retrieval and answering, so bad intermediate outputs are caught before the final answer is written."
        correct: false
        rationale: "A programmatic gate checks intermediate steps, but the framework's abstraction still obscures the underlying prompts and responses, which is what makes the failures hard to debug."
      - id: C
        text: "Turn the feature into a fully autonomous agent so the framework can plan its own steps and handle more of the retrieval and answer logic."
        correct: false
        rationale: "Adding autonomy increases complexity and cost for a task that only needs a simple pattern."
      - id: D
        text: "Build the pattern directly on the LLM API in a few lines of code, and if a framework is kept, make sure the team understands its underlying code."
        correct: true
        rationale: "Frameworks can obscure the underlying prompts and responses, making them harder to debug; the guidance is to start with LLM APIs directly and, if using a framework, understand what it does underneath."
    source:
      title: "Building effective agents"
      url: "https://www.anthropic.com/engineering/building-effective-agents"
  - id: ccdv-f.D1.S3.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "An agent works on a multi-day migration with clear milestones. Each working session starts with a fresh context window, and the agent keeps losing track of which milestones are already done. Which memory technique best fits?"
    select: 1
    options:
      - id: A
        text: "Switch to a model with a much larger context window so the whole multi-day history fits into a single session and nothing needs reloading."
        correct: false
        rationale: "The work spans separate sessions, and more context is not automatically better because recall degrades as token count grows."
      - id: B
        text: "Structured note-taking: the agent keeps progress notes, like a to-do file, outside the context window and reads them back each session."
        correct: true
        rationale: "Structured note-taking persists notes outside the context window and reloads them later; it is best for iterative development with clear milestones."
      - id: C
        text: "Spawn a parallel sub-agent with a clean context window for each milestone, and discard each sub-agent's results as soon as it has finished."
        correct: false
        rationale: "Sub-agents give clean context for parallel exploration, but discarding their results does nothing to preserve progress across sessions."
      - id: D
        text: "Keep the raw tool calls and results from every earlier session in the prompt, so the agent can re-read exactly what it has already done."
        correct: false
        rationale: "Raw tool results deep in the history are superfluous content worth clearing, and recall degrades as the token count grows; nothing here persists progress outside the window."
    source:
      title: "Effective context engineering for AI agents"
      url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
