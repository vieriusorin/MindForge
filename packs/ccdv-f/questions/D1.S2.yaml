skill: D1.S2
questions:
  - id: ccdv-f.D1.S2.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A team wants to embed an agent inside their own Python service that runs on their infrastructure. The agent needs Claude Code's built-in file and shell tools, permissions, sessions it can resume, and hooks. They do not want to write and maintain the tool-use loop themselves. Which option best fits?"
    select: 1
    options:
      - id: A
        text: "Call the Messages API through the Client SDK and implement the tool loop, tools, and permission checks by hand."
        correct: false
        rationale: "With the Client SDK you write the tool loop yourself (or use the beta tool runner) and none of Claude Code's built-in tools, permissions, sessions, or hooks come with it."
      - id: B
        text: "Have developers run the Claude Code CLI interactively in a terminal on the server."
        correct: false
        rationale: "The interactive CLI is built for daily interactive use and one-off terminal tasks, not for embedding an agent inside an application."
      - id: C
        text: "Use Managed Agents so Anthropic hosts the agent harness and runs the agent loop."
        correct: false
        rationale: "Managed Agents is a hosted harness configured through the Claude API; the requirement is to embed the agent in the team's own Python application process."
      - id: D
        text: "Use the Claude Agent SDK, which embeds Claude Code's agent loop, built-in tools, permissions, sessions, and hooks in a Python or TypeScript application you operate."
        correct: true
        rationale: "The Agent SDK is the option for embedding Claude Code's agent in your own Python or TypeScript application, in a process you operate, with built-in tools, permissions, sessions, and hooks."
    source:
      title: "Agent SDK overview"
      url: "https://code.claude.com/docs/en/agent-sdk/overview"
  - id: ccdv-f.D1.S2.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A team's coding agent is instructed in CLAUDE.md to run the project formatter after every file edit, but in long sessions it sometimes forgets. The team wants the formatter to run after every Edit or Write, every time, regardless of what the model decides. What should they do?"
    select: 1
    options:
      - id: A
        text: "Rewrite the CLAUDE.md line in capital letters and mark it IMPORTANT."
        correct: false
        rationale: "CLAUDE.md is read by the model, which decides what to do with it; extra emphasis does not turn a guideline into a guarantee."
      - id: B
        text: "Create a Skill that describes the formatting procedure so Claude loads it when relevant."
        correct: false
        rationale: "Skills that Claude picks up itself are still non-deterministic: the model decides whether and when to use them."
      - id: C
        text: "Configure a PostToolUse hook with the matcher Edit|Write that runs the formatter after each matching tool call."
        correct: true
        rationale: "Hooks are executed by the harness, not the model, so a PostToolUse hook matched to Edit|Write runs the formatter after every edit whether or not Claude remembers the rule."
      - id: D
        text: "Add a subagent whose description says it formats code, and ask Claude to delegate to it after edits."
        correct: false
        rationale: "Delegating to a subagent is still a model decision, so it is not guaranteed to happen after every edit."
    source:
      title: "Best practices for Claude Code"
      url: "https://code.claude.com/docs/en/best-practices"
