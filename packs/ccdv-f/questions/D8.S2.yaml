skill: D8.S2
questions:
  - id: ccdv-f.D8.S2.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A platform team is building one central MCP server that many employees' AI applications will connect to over the network, with authenticated access. Which transport best fits?"
    select: 1
    options:
      - id: A
        text: "stdio, since it has the lowest overhead and a single stdio server can be shared by many remote clients over the network."
        correct: false
        rationale: "The stdio transport is for direct communication between local processes on the same machine (its performance comes from having no network overhead) and typically serves a single client."
      - id: B
        text: "Streamable HTTP: HTTP POST with optional Server-Sent Events and standard HTTP auth, ideally with OAuth-obtained tokens."
        correct: true
        rationale: "Streamable HTTP enables remote server communication, supports standard HTTP authentication methods (MCP recommends OAuth), and remote servers using it typically serve many clients."
      - id: C
        text: "Sampling, so the central server can request completions from each connecting client's own language model over the network."
        correct: false
        rationale: "Sampling is a client primitive, not a transport, and it is deprecated in the current protocol version."
      - id: D
        text: "A raw WebSocket connection, which MCP specifies as its standard transport for remote servers that serve many clients at once."
        correct: false
        rationale: "MCP defines two transports, stdio and Streamable HTTP; a raw WebSocket is not one of them."
    source:
      title: "Architecture overview - Model Context Protocol"
      url: "https://modelcontextprotocol.io/docs/learn/architecture"
  - id: ccdv-f.D8.S2.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A developer is designing an MCP server for a company database. It should (1) offer the database schema as read-only context the host application can attach, (2) let the model run parameterized queries when it decides they are needed, and (3) provide a reusable \"weekly sales report\" template users start explicitly, for example from a slash command. Which mapping to MCP primitives best fits?"
    select: 1
    options:
      - id: A
        text: "All three as tools (model-controlled), so the model decides when to read the schema, run a query, or start the report."
        correct: false
        rationale: "Tools are model-controlled actions; read-only context and user-invoked templates have their own primitives with different control models."
      - id: B
        text: "Schema as a prompt (user-controlled), queries as a resource (application-controlled), report template as a tool (model-controlled)."
        correct: false
        rationale: "This inverts the primitives: resources are passive read-only data, tools perform actions, and prompts are user-invoked templates."
      - id: C
        text: "Schema and report template written into the query tool's description, with that query tool as the only primitive exposed."
        correct: false
        rationale: "Database schemas are the page's example of a resource, read-only context the application controls, and a user-started template is a prompt, which needs explicit invocation."
      - id: D
        text: "Schema as a resource (application-controlled), queries as a tool (model-controlled), report template as a prompt (user-controlled)."
        correct: true
        rationale: "Resources are passive, read-only data sources the application controls; tools are functions the model decides to call; prompts are reusable templates that require explicit user invocation."
    source:
      title: "Understanding MCP servers - Model Context Protocol"
      url: "https://modelcontextprotocol.io/docs/learn/server-concepts"
