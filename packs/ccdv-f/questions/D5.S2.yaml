skill: D5.S2
questions:
  - id: ccdv-f.D5.S2.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A team wrote its own HTTP wrapper around the Claude API. It has no retry logic, and it detects error types by string-matching error messages. Transient failures such as rate limits and 5xx errors frequently surface to users. What should the developer do?"
    select: 1
    options:
      - id: A
        text: "Switch to the official SDK, which retries transient failures with backoff and honors retry-after, and catch its typed exceptions instead of matching strings."
        correct: true
        rationale: "The official SDK retries connection errors, rate limits and 5xx errors with exponential backoff by default, honoring retry-after, and raises typed exceptions that should be caught instead of string-matching messages."
      - id: B
        text: "Keep the wrapper and extend its string matching to cover the error messages seen in production so far, adding new patterns as other types appear."
        correct: false
        rationale: "Error type values may expand over time, so string matching is brittle; typed SDK classes are the recommended approach."
      - id: C
        text: "Retry every failed request, including 400 errors, a fixed number of times with no delay between attempts, and ignore any retry-after header that comes back on a 429."
        correct: false
        rationale: "Invalid requests will not succeed on retry, and retries without backoff add load during rate limiting and overload."
      - id: D
        text: "Open a new HTTP connection for every request and turn off TCP keep-alive, so that no stale socket can trigger the rate limit or the 5xx failures."
        correct: false
        rationale: "A 429 means the organization hit a rate limit and a 500 is an error inside Anthropic's systems, so fresh connections fix neither; the page recommends keep-alive, not removing it."
    source:
      title: "Claude API errors"
      url: "https://platform.claude.com/docs/en/api/errors"
  - id: ccdv-f.D5.S2.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A developer streams responses that include tool calls over server-sent events. Their code calls JSON.parse on each input_json_delta event and keeps throwing parse errors. What should the developer do?"
    select: 1
    options:
      - id: A
        text: "Disable streaming for each request that defines tools, since tool_use input cannot be sent as server-sent events."
        correct: false
        rationale: "Tool use can be streamed; tool_use input arrives as input_json_delta events."
      - id: B
        text: "Ask Claude in the system prompt to emit smaller JSON objects, so that each input_json_delta carries one complete object."
        correct: false
        rationale: "Deltas are partial JSON strings by design; prompting cannot make each event a complete object."
      - id: C
        text: "Accumulate the block's partial_json strings and parse them once content_block_stop arrives, or use the SDK's streaming helpers."
        correct: true
        rationale: "Input JSON deltas are partial JSON strings while the final tool_use input is an object; accumulate the deltas and parse at content_block_stop, or let the SDK helpers do it."
      - id: D
        text: "Treat each parse error as an overloaded_error event and restart the stream with exponential backoff until parsing succeeds."
        correct: false
        rationale: "Stream error events are explicit error events; these parse failures come from the client parsing fragments too early."
    source:
      title: "Streaming messages"
      url: "https://platform.claude.com/docs/en/build-with-claude/streaming"
