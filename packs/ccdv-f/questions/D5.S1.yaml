skill: D5.S1
questions:
  - id: ccdv-f.D5.S1.q1
    status: unreviewed
    stem: "A developer estimates context usage by counting only the tokens in user messages. Their agent, which has many tool definitions and returns large tool results, starts receiving a 400 \"prompt is too long\" error even though the user messages are short. Which understanding best explains this and guides the fix?"
    select: 1
    options:
      - id: A
        text: "Only user and assistant text count toward the context window; the error must come from a malformed request."
        correct: false
        rationale: "Tool definitions, tool results, images, documents and the system prompt all count toward the context window."
      - id: B
        text: "Everything in the request counts, including the system prompt, tool definitions, and every message with its tool results; estimate requests with the token counting API and trim or manage context accordingly."
        correct: true
        rationale: "The context window includes the system prompt, every message including tool results, and tool definitions; if the input alone exceeds the window, the API returns a 400 \"prompt is too long\" error, and the token counting API estimates usage before sending."
      - id: C
        text: "Prompt caching removes cached tokens from the context window, so caching the tool definitions will fix the error."
        correct: false
        rationale: "Cached prefixes still occupy the context window; caching changes what you pay, not whether tokens count."
      - id: D
        text: "Raising max_tokens gives the model more context to work with and will prevent the error."
        correct: false
        rationale: "max_tokens caps generated output; it does not enlarge the window available for input."
    source:
      title: "Context windows"
      url: "https://platform.claude.com/docs/en/build-with-claude/context-windows"
  - id: ccdv-f.D5.S1.q2
    status: unreviewed
    stem: "A high-volume service uses Claude for short, simple classification requests. Quality on the team's evals is already good, but the team wants lower latency and fewer tokens per response without switching models. What should the developer do?"
    select: 1
    options:
      - id: A
        text: "Enable fast mode to reduce the cost of each request."
        correct: false
        rationale: "Fast mode delivers higher output speed at premium pricing, so it raises cost rather than lowering it."
      - id: B
        text: "Lower temperature to 0 so the model generates fewer tokens."
        correct: false
        rationale: "Sampling parameters do not control how many tokens Claude spends, and temperature, top_p and top_k are removed in newer API versions."
      - id: C
        text: "Set output_config.effort to low and confirm on the evals that quality holds."
        correct: true
        rationale: "Effort trades thoroughness for token efficiency within a single model and affects all output tokens; low is suited to simpler tasks that need the best speed and lowest cost."
      - id: D
        text: "Increase max_tokens so responses finish sooner."
        correct: false
        rationale: "max_tokens is only an upper limit on output; raising it does not make responses shorter or faster."
    source:
      title: "Effort"
      url: "https://platform.claude.com/docs/en/build-with-claude/effort"
