skill: D6.S1
questions:
  - id: ccdv-f.D6.S1.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A long-running agent calls search and file-reading tools dozens of times. The raw outputs of early tool calls stay in the conversation long after they are useful, and answer quality degrades as the context grows. Which first step best fits?"
    select: 1
    options:
      - id: A
        text: "Move to a model with a larger context window, since context pollution stops degrading answers once the window is large enough."
        correct: false
        rationale: "Context windows of all sizes are expected to stay subject to context pollution and relevance concerns, and recall degrades as token count grows (context rot)."
      - id: B
        text: "Preload all relevant documents at the start, so the agent makes fewer tool calls and its context stays leaner over the run."
        correct: false
        rationale: "Front-loading everything adds even more tokens; just-in-time retrieval with lightweight references keeps context lean."
      - id: C
        text: "Clear raw tool results deep in the history that are no longer needed, leaving the rest of the conversation intact."
        correct: true
        rationale: "Tool result clearing is described as one of the safest, lightest-touch forms of compaction, removing stale raw tool outputs that consume the attention budget."
      - id: D
        text: "Keep the raw outputs and list in the system prompt which early results to ignore, so those tokens stop drawing on attention."
        correct: false
        rationale: "The stale tokens stay in context and keep depleting the attention budget; the goal is the smallest possible set of high-signal tokens, which means removing them."
    source:
      title: "Effective context engineering for AI agents"
      url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  - id: ccdv-f.D6.S1.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "During a Claude Code session, the main task needs the answer to \"which modules import the legacy auth client?\" Finding it requires a wide search that produces a lot of output, but the main conversation only needs the final list. Which approach best fits?"
    select: 1
    options:
      - id: A
        text: "Delegate the search to a subagent, which works in its own context and returns only the summary to the main conversation."
        correct: true
        rationale: "Subagents run in their own context window and return only the summary, keeping exploration output out of the main conversation."
      - id: B
        text: "Run the full search in the main conversation and then run /compact, so the long output is summarized after it has been read."
        correct: false
        rationale: "Subagents exist for side tasks that would flood the main conversation with search results; /compact acts only after that output has already landed there."
      - id: C
        text: "Run /clear before the search so the main conversation has enough free room to hold the full search output."
        correct: false
        rationale: "/clear acts on the main conversation and drops the task the search serves, and the verbose output still lands there; a subagent keeps it in its own context."
      - id: D
        text: "Paste the search results into CLAUDE.md, so the final list and the raw output load into later sessions as well."
        correct: false
        rationale: "CLAUDE.md loads into every session, so this would make the bloat permanent rather than isolating it."
    source:
      title: "Create custom subagents"
      url: "https://code.claude.com/docs/en/sub-agents"
