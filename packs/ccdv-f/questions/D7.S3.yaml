skill: D7.S3
questions:
  - id: ccdv-f.D7.S3.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A team wants Claude Code to be stopped before it runs any Bash command that deletes files recursively in the repository, and wants Claude to be told why the command was blocked. Which control best fits?"
    select: 1
    options:
      - id: A
        text: "A PostToolUse hook matching Bash that exits with code 2 and writes the reason to stderr when the command was a recursive delete."
        correct: false
        rationale: "PostToolUse cannot block: on exit 2 it only shows stderr to Claude, because the tool already ran and the files are gone."
      - id: B
        text: "A PreToolUse hook matching Bash that exits with code 2 and writes the reason to stderr when the command is a recursive delete."
        correct: true
        rationale: "Exiting with code 2 from a PreToolUse hook blocks the tool call, and the hook's stderr is the message fed back to Claude."
      - id: C
        text: "A Stop hook that exits with code 2 and writes the reason to stderr when the turn's Bash commands included a recursive delete."
        correct: false
        rationale: "A Stop hook runs when Claude finishes responding, and exit 2 there only keeps Claude working; the delete has already run."
      - id: D
        text: "A PermissionRequest hook matching Bash that exits with code 2 and writes the reason to stderr when the command is a recursive delete."
        correct: false
        rationale: "Exit code 2 is not honored on PermissionRequest, so the permission flow proceeds unchanged; denying there needs the decision object."
    source:
      title: "Hooks reference"
      url: "https://code.claude.com/docs/en/hooks"
  - id: ccdv-f.D7.S3.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A developer writes a PreToolUse hook that returns permissionDecision \"allow\" for git push commands, to avoid prompts. The organization's managed settings contain a deny rule matching git push. What happens when Claude tries to run git push?"
    select: 1
    options:
      - id: A
        text: "The push runs, because a hook's allow decision overrides permission rules."
        correct: false
        rationale: "PreToolUse hook decisions do not bypass permission rules; deny rules are still evaluated."
      - id: B
        text: "The push runs only if the hook times out, because a timed-out PreToolUse hook blocks nothing and approves the call."
        correct: false
        rationale: "A timed-out hook does not block (unless configured to), but staying silent never approves a call either, and the deny rule still applies."
      - id: C
        text: "The push is blocked, because Claude Code evaluates deny and ask rules regardless of what a PreToolUse hook returns."
        correct: true
        rationale: "A matching deny rule blocks the call even when the hook returned allow, preserving deny-first precedence, including for deny rules in managed settings."
      - id: D
        text: "Claude Code prompts the user to choose between the hook and the deny rule."
        correct: false
        rationale: "Deny rules are not converted into a prompt; a matching deny rule blocks the call."
    source:
      title: "Configure permissions"
      url: "https://code.claude.com/docs/en/permissions"
