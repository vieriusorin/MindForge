skill: D5.S4
questions:
  - id: ccdv-f.D5.S4.q1
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A chatbot sends a large, unchanging reference document on every request and enables prompt caching. However, usage shows cache_read_input_tokens is always 0. The system prompt starts with a line containing the current timestamp, followed by the reference document. What should the developer do?"
    select: 1
    options:
      - id: A
        text: "Move the timestamp and other per-request content after the reference document, and set the breakpoint at the end of that static prefix."
        correct: true
        rationale: "Caching matches the full prefix up to the breakpoint and requires identical segments; content that changes every request, such as a timestamp, inside the prefix means the cache never hits."
      - id: B
        text: "Switch the cached blocks to the 1-hour cache TTL, so each cache entry outlives the gap between user requests and later calls can read it."
        correct: false
        rationale: "Cache hits require 100 percent identical prompt segments up to the breakpoint, so a longer TTL does not help when the timestamp makes the prefix differ on every request."
      - id: C
        text: "Add up to four cache breakpoints between the timestamp line and the document, so each section of the system prompt is cached separately."
        correct: false
        rationale: "Caching covers the full prefix up to and including the marked block, so every breakpoint after the timestamp still includes it and misses."
      - id: D
        text: "Move the cache breakpoint onto the timestamp line itself, so the entry it writes covers that line plus the reference document that follows it."
        correct: false
        rationale: "Caching covers the prefix up to and including the marked block, so the document after the timestamp is not in the entry, and the changing timestamp makes each request pay for a fresh cache write and never get a read."
    source:
      title: "Prompt caching"
      url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"
  - id: ccdv-f.D5.S4.q2
    origin: ai
    author: vlad.parvana@ddroidd.com
    stem: "A developer is building a cost and throughput model for an app that relies heavily on prompt caching. Which two statements are accurate? (Select TWO.)"
    select: 2
    options:
      - id: A
        text: "The input_tokens usage field reports the total number of input tokens in the request."
        correct: false
        rationale: "input_tokens covers only tokens after the last cache breakpoint, so with caching it can be much smaller than the total input."
      - id: B
        text: "Total input tokens equal cache_read_input_tokens + cache_creation_input_tokens + input_tokens."
        correct: true
        rationale: "This is the documented formula for total input when prompt caching is used."
      - id: C
        text: "Setting a high max_tokens reduces available output-tokens-per-minute (OTPM) capacity even if the model writes a short answer."
        correct: false
        rationale: "OTPM counts only the output tokens actually generated; max_tokens does not factor into OTPM."
      - id: D
        text: "Cached prompt prefixes no longer occupy the context window."
        correct: false
        rationale: "Cached prefixes still occupy the context window; caching changes what you pay, not whether they count."
      - id: E
        text: "For most current models, cache_read_input_tokens do not count toward the input-tokens-per-minute (ITPM) rate limit."
        correct: true
        rationale: "For most models only uncached input tokens (input_tokens plus cache_creation_input_tokens) count toward ITPM, which makes caching a way to raise effective throughput."
    source:
      title: "Rate limits"
      url: "https://platform.claude.com/docs/en/api/rate-limits"
