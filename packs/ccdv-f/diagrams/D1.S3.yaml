diagrams:
  # MINDFORGE.md §2.5 "agent loop as bee foraging", copied verbatim (MF-0006 SC-6).
  - id: ccdv-f.D1.S3.diagram-bee-agent-loop
    title: "The agent tool-use loop as bee foraging"
    origin: human
    author: vlad.parvana@ddroidd.com
    mermaid: |
      flowchart LR
        A[Hive: user goal] --> B[Bee decides: think]
        B --> C{Need a flower?<br/>tool call}
        C -- yes --> D[Fly + collect<br/>execute tool]
        D --> E[Return nectar<br/>tool_result]
        E --> B
        C -- no --> F[Bring honey home<br/>final answer]
    nodes:
      - { id: A, label: "Hive: the user's goal" }
      - { id: B, label: "Bee decides: the model thinks" }
      - { id: C, label: "Need a flower? A tool call" }
      - { id: D, label: "Fly and collect: execute the tool" }
      - { id: E, label: "Return nectar: the tool_result" }
      - { id: F, label: "Bring honey home: the final answer" }
    sources:
      - https://www.anthropic.com/engineering/building-effective-agents
