  - id: ccdv-f.D1.S3.diagram-bee-agent-loop
    title: "The agent tool-use loop as bee foraging"
    origin: human
    author: vlad.parvana@ddroidd.com
    direction: LR
    nodes:
      - { id: A, label: "Hive: the user's goal" }
      - { id: B, label: "Bee decides: the model thinks" }
      - { id: C, label: "Need a flower? A tool call", shape: decision }
      - { id: D, label: "Fly and collect: execute the tool" }
      - { id: E, label: "Return nectar: the tool call results" }
      - { id: F, label: "Bring honey home: the final answer" }
