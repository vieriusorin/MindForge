skill: D4.S1
cards:
  - id: subagents.D4.S1.card-big-output-small-result
    concept: Delegate when the work is noisy and the answer is small
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: foundation
    simply: >-
      Delegation pays off when a task produces far more output than you need. Ask Claude Code to
      "use a subagent to run the test suite and report only the failing tests with their error
      messages": the thousands of lines of test output stay in the subagent's context, and only the
      list of failures comes back to your main conversation. The same holds for fetching documentation
      or processing log files. When three investigations are independent (auth, database, API), run
      them as parallel subagents and let Claude synthesize the findings; when one step needs the
      previous step's result (find performance issues, then fix them), chain the subagents. Keep the
      work in the main conversation when it needs back-and-forth, when phases share a lot of context,
      or when it is a quick, targeted change.
    inNature: >-
      Honeybee scouts (an analogy). When a colony needs a new home, scouts fly out separately, inspect
      sites the rest of the swarm never sees, and come back with a short dance that tells the others
      where the good site is, not the whole journey.
    whereItBreaks:
      - "Only a few hundred of a swarm's thousands of bees scout, and the rest wait and spend little. A subagent's own requests still draw on your usage, and in Anthropic's research system multi-agent systems used about 15× more tokens than chats."
      - "Scouts keep dancing on the swarm cluster, recruiting more scouts, until enough of them gather at one site. A subagent returns its result to Claude once, and many subagents each returning detailed results can still consume significant context."
      - "A scout gathers its knowledge on the trip itself. A subagent that isn't a fork starts fresh and may need time to gather context, so for a quick, targeted change or when latency matters the page keeps the work in the main conversation."
    contrast: >-
      Doing the work in the main conversation keeps every line of output and every intermediate step
      in your context, which suits iterative, back-and-forth work. Delegation trades that for a clean
      context and a summary, at the price of the subagent's own token spend and start-up time.
    diagram: subagents.D4.S1.diagram-should-i-delegate
    sources:
      - https://code.claude.com/docs/en/sub-agents
      - https://code.claude.com/docs/en/costs
      - https://www.anthropic.com/research/multi-agent-research-system
