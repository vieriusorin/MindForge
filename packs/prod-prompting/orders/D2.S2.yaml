skill: D2.S2
orders:
  - id: prod-prompting.D2.S2.order-client-tool-turn
    title: "A response comes back from a request that offered client tools. Put your app's handling of a client tool call in order."
    origin: ai
    author: sorin.vieriu@ddroidd.com
    generatedBy: { model: claude-opus-5-5, prompt: mf0066-hand-session }
    level: practitioner
    diagram: prod-prompting.D2.S2.diagram-loop
    steps:
      - { node: STOP, label: "stop_reason is tool_use?" }
      - { node: RUN, label: "Your app runs each tool_use (id, name, input)" }
      - { node: OK, label: "Tool succeeded?" }
      - { node: RES, label: "tool_result with tool_use_id, first in the user message" }
    orderedBy:
      - "The response has a `stop_reason` of `tool_use` and one or more `tool_use` content blocks"
      - "When you receive a tool use response for a client tool, you should:"
      - "2. Run the actual tool in your code base corresponding to that tool name, passing in the tool `input`."
      - "If the tool itself throws an error during execution (for example, a network error when fetching weather data), you can return the error message in the `content` along with `\"is_error\": true`"
      - "3. Continue the conversation by sending a new message with the `role` of `user`, and a `content` block containing the `tool_result` type"
    explanation: >-
      A client tool call shows up as a response whose stop_reason is tool_use. Your code then runs the tool
      named in each tool_use block with its input. Once it has run you know whether it succeeded, and that
      decides what goes back: on success a tool_result carrying the tool_use_id; on an error the same block
      can carry the error message with is_error set to true. Either way it is sent in a new user message, with the tool_result blocks first in its content.
    source:
      title: Handle tool calls
      url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls
  - id: prod-prompting.D2.S2.order-round-trip-start
    title: "You send a request that defines a client tool. Put the start of the round trip in order."
    origin: ai
    author: sorin.vieriu@ddroidd.com
    generatedBy: { model: claude-opus-5-5, prompt: mf0066-hand-session }
    level: foundation
    diagram: prod-prompting.D2.S2.diagram-loop
    steps:
      - { node: REQ, label: "Request: messages + tools" }
      - { node: STOP, label: "stop_reason is tool_use?" }
      - { node: RUN, label: "Your app runs each tool_use (id, name, input)" }
    orderedBy:
      - "Claude responds with `stop_reason: \"tool_use\"` and one or more `tool_use` blocks. Your code runs the operation and sends back a `tool_result`."
      - "The first request defines a `get_weather` tool, and Claude answers the question by calling it: the response carries a `tool_use` block, your code runs the lookup, and a second request sends the result back in a `tool_result` block so Claude can reply with the answer."
    explanation: >-
      The round trip starts with your request, which carries the messages and the tool definitions. Claude's
      response then has stop_reason tool_use and one or more tool_use blocks, and only after that response
      does your code run the operation (the second request carries the result back).
    source:
      title: Tool use with Claude
      url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
  - id: prod-prompting.D2.S2.order-tool-error
    title: "A client tool you offered fails with an error during execution. Put your app's steps in order, from Claude's response to the next request."
    origin: ai
    author: sorin.vieriu@ddroidd.com
    generatedBy: { model: claude-opus-5-5, prompt: mf0066-hand-session }
    level: practitioner
    diagram: prod-prompting.D2.S2.diagram-loop
    steps:
      - { node: STOP, label: "stop_reason is tool_use?" }
      - { node: RUN, label: "Your app runs each tool_use (id, name, input)" }
      - { node: OK, label: "Tool succeeded?" }
      - { node: ERR, label: "tool_result with is_error true and an instructive message" }
      - { node: REQ, label: "Request: messages + tools" }
    orderedBy:
      - "The response has a `stop_reason` of `tool_use` and one or more `tool_use` content blocks"
      - "When you receive a tool use response for a client tool, you should:"
      - "2. Run the actual tool in your code base corresponding to that tool name, passing in the tool `input`."
      - "If the tool itself throws an error during execution (for example, a network error when fetching weather data), you can return the error message in the `content` along with `\"is_error\": true`"
      - "3. Continue the conversation by sending a new message with the `role` of `user`, and a `content` block containing the `tool_result` type"
    explanation: >-
      A tool use response for a client tool has stop_reason tool_use, and your code then runs the tool.
      An error the tool throws during execution can be returned as a tool_result whose content is the error
      message, with is_error set to true (the page asks for instructive
      messages: what went wrong and what to try next). That tool_result goes back in a new user message, so
      the conversation continues with the next request.
    source:
      title: Handle tool calls
      url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls
