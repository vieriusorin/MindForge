skill: D1.S2
questions:
  - id: prod-prompting.D1.S2.q1
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: foundation
    stem: "A developer wants Claude to reply in a fixed format and tone, and decides to add examples to the prompt. What does the prompting guide recommend?"
    select: 1
    options:
      - id: A
        text: "Exactly one example, because giving more than one makes Claude copy the examples word for word."
        correct: false
        rationale: "The guide recommends several examples, varied enough that Claude does not pick up unintended patterns."
      - id: B
        text: "Ten or more near-identical examples, so the pattern is impossible to miss."
        correct: false
        rationale: "Near-identical examples teach the accidental sameness too; the guide asks for relevant and diverse examples."
      - id: C
        text: "Three to five relevant, diverse examples, each wrapped in <example> tags (several inside <examples>)."
        correct: true
        rationale: "The guide calls few-shot examples one of the most reliable ways to steer format, tone and structure, and recommends 3 to 5 that are relevant, diverse and structured in tags."
      - id: D
        text: "No examples, because current models follow written instructions only."
        correct: false
        rationale: "The guide states examples improve accuracy and consistency, and that multishot examples also work with thinking."
    source:
      title: "Prompting best practices"
      url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
  - id: prod-prompting.D1.S2.q2
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: foundation
    stem: "What does the effort parameter (output_config.effort) control in a Messages API request?"
    select: 1
    options:
      - id: A
        text: "How many tokens Claude spends across text, tool calls and thinking, trading response thoroughness for token efficiency."
        correct: true
        rationale: "Effort trades response thoroughness against token efficiency with one model, and it affects all output tokens, including tool calls and thinking when active."
      - id: B
        text: "The size of the context window available to the request, so a higher level lets more input fit into each call."
        correct: false
        rationale: "Effort changes how much Claude writes and thinks, not how much input fits in the window."
      - id: C
        text: "How random the next-token choice is, like a temperature setting, with higher levels giving more varied wording."
        correct: false
        rationale: "The docs define effort as how many tokens Claude spends when responding, trading thoroughness against token efficiency, not as a sampling setting."
      - id: D
        text: "An exact thinking budget in tokens that the model can never exceed, replacing max_tokens as the hard limit on total output."
        correct: false
        rationale: "The docs call effort a behavioral signal, not a strict token budget; max_tokens stays the hard limit on total output."
    source:
      title: "Effort"
      url: "https://platform.claude.com/docs/en/build-with-claude/effort"
  - id: prod-prompting.D1.S2.q3
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: practitioner
    stem: "A review summarizer's prompt has four examples, all of short, positive reviews. On long, angry reviews Claude still produces short, upbeat summaries. What is the best fix?"
    select: 1
    options:
      - id: A
        text: "Delete the examples and rely on written instructions alone, describing the tone and length wanted for each review type."
        correct: false
        rationale: "Examples are one of the most reliable ways to steer output; the problem is what these examples show, not that there are examples."
      - id: B
        text: "Add a fifth short, positive example, so the pattern is even clearer and Claude follows the existing format more closely."
        correct: false
        rationale: "Another look-alike example deepens the unintended pattern; the guide asks for examples that cover edge cases and vary enough to avoid it."
      - id: C
        text: "Cut the set down to a single example so Claude has less to copy, keeping it short and positive like the current four."
        correct: false
        rationale: "The guide recommends 3 to 5 examples, and one short, positive example still shows only one kind of review."
      - id: D
        text: "Make the examples diverse, including long and negative reviews, so Claude does not learn an unintended pattern."
        correct: true
        rationale: "The guide asks for examples that are relevant and diverse, covering edge cases and varying enough that Claude does not pick up unintended patterns."
    source:
      title: "Prompting best practices"
      url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
  - id: prod-prompting.D1.S2.q4
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: practitioner
    stem: "An orchestrator fans out thousands of short, simple subagent calls. Latency and cost matter, and the team's evals show quality holds at lower settings. Which effort level fits?"
    select: 1
    options:
      - id: A
        text: "max, so every subagent reasons as deeply as possible, with no constraint on how many tokens it spends."
        correct: false
        rationale: "max has no constraints on token spending and the table reserves it for the deepest reasoning and most thorough analysis, not short, cost-sensitive calls."
      - id: B
        text: "low, the most efficient level, which the effort table suggests for simple, cost-sensitive work like subagents."
        correct: true
        rationale: "The effort table lists low for simpler tasks needing the best speed and lowest costs, naming subagents as the example; the evals confirm quality holds."
      - id: C
        text: "xhigh, because subagents are part of an agentic system and xhigh is the level built for agentic work."
        correct: false
        rationale: "xhigh is for long-running agentic and coding tasks, over 30 minutes with token budgets in the millions, not short scoped calls."
      - id: D
        text: "Leave effort unset, because a request that omits it runs at the model's lowest and cheapest level."
        correct: false
        rationale: "Omitting effort applies the model's default level, which is not low on any model (per the docs at time of writing, high on most and medium on a few)."
    source:
      title: "Effort"
      url: "https://platform.claude.com/docs/en/build-with-claude/effort"
  - id: prod-prompting.D1.S2.q5
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: expert
    stem: "A long chat relies on prompt caching to stay cheap. To save money, a developer changes the top-level effort on every request based on how hard the latest question looks. What is the trap?"
    select: 1
    options:
      - id: A
        text: "Effort cannot change after the first request; the API returns a 400 error when a later request sends a new level."
        correct: false
        rationale: "The docs say a new top-level value can be set on the next request; it takes effect and starts the cache over."
      - id: B
        text: "Changes after the first turn are ignored and the original level is kept, so there is no cost saving but also no harm done."
        correct: false
        rationale: "The change takes effect; a new top-level value on the next request starts the cache over."
      - id: C
        text: "Changing top-level effort between requests invalidates the prompt cache; keep it fixed, or use per-message effort if supported."
        correct: true
        rationale: "The effort docs say changing the top-level value invalidates prompt caching, and per-message effort (beta, on the models the docs list at time of writing) preserves the cache."
      - id: D
        text: "Effort only changes thinking, so it cannot affect caching or cost, and the conversation stays cached between requests either way."
        correct: false
        rationale: "Effort affects all output tokens, and changing the top-level value breaks cache hits."
    source:
      title: "Effort"
      url: "https://platform.claude.com/docs/en/build-with-claude/effort"
  - id: prod-prompting.D1.S2.q6
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: expert
    stem: "To cap thinking cost, a team sends thinking {type: enabled, budget_tokens: 10000} to a Claude 4.7 or later model. What happens, and what does the guide recommend?"
    select: 1
    options:
      - id: A
        text: "The budget is honored exactly, so budget_tokens stays the right control for a hard ceiling on thinking cost per request."
        correct: false
        rationale: "On Claude 4.7 and later, setting budget_tokens returns a 400 error."
      - id: B
        text: "It returns a 400 error; use adaptive thinking, steer depth with effort, and set max_tokens as the hard limit."
        correct: true
        rationale: "The guide says budget_tokens returns 400 on 4.7 and later and recommends lowering effort, or using max_tokens as a hard limit, with adaptive thinking."
      - id: C
        text: "The parameter is ignored and the model silently falls back to adaptive thinking, with no cap on its thinking tokens."
        correct: false
        rationale: "It is rejected with a 400 error, not ignored."
      - id: D
        text: "It is accepted but deprecated, as on Opus and Sonnet 4.6, so it still caps thinking cost until support is removed later."
        correct: false
        rationale: "That describes Opus 4.6 and Sonnet 4.6, where a budget_tokens cap still works but is deprecated; on Claude 4.7 and later, setting budget_tokens returns a 400 error."
    source:
      title: "Prompting best practices"
      url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
