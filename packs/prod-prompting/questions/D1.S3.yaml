skill: D1.S3
questions:
  - id: prod-prompting.D1.S3.q1
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: foundation
    stem: "A service parses Claude's replies with JSON.parse() and sometimes crashes on malformed output. What does turning on structured outputs (a JSON schema in output_config.format) give it?"
    select: 1
    options:
      - id: A
        text: "Responses constrained to the schema: valid JSON, required fields present, correct types, no retries for violations."
        correct: true
        rationale: "Structured outputs use constrained decoding to guarantee schema-compliant responses: always valid, type safe, no retries for schema violations."
      - id: B
        text: "Schema-valid JSON even when a reply is cut off at max_tokens, so a truncated response still parses cleanly downstream."
        correct: false
        rationale: "The docs list a max_tokens cut-off as a case where output may be incomplete and not match the schema; retry with a higher max_tokens."
      - id: C
        text: "A guarantee that Claude never refuses a request, because the schema takes precedence over its safety behavior."
        correct: false
        rationale: "Claude keeps its safety behavior; a refusal can still happen, and the refusal message takes precedence over the schema."
      - id: D
        text: "Zero extra input tokens and an unchanged prompt cache, because the schema is enforced outside the model."
        correct: false
        rationale: "Claude receives an extra system prompt describing the format, so input tokens go up slightly, and changing output_config.format invalidates the prompt cache."
    source:
      title: "Structured outputs"
      url: "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"
  - id: prod-prompting.D1.S3.q2
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: foundation
    stem: "Which success criterion for a sentiment classifier is written the way Anthropic's guide recommends?"
    select: 1
    options:
      - id: A
        text: "The model should classify sentiments well on the kinds of social posts our users usually write."
        correct: false
        rationale: "The guide uses \"The model should classify sentiments well\" as its bad example; naming the posts does not make it specific or measurable."
      - id: B
        text: "Outputs should be safe and helpful for our users, with no toxic replies we would regret."
        correct: false
        rationale: "Too hazy; the guide shows even safety can be quantified, for example a flagged-output rate over a number of trials."
      - id: C
        text: "F1 of at least 0.85 on 10,000 held-out, diverse posts, a 5% gain over the current baseline."
        correct: true
        rationale: "The guide's good example: specific, measurable, achievable relative to a baseline, and relevant to the use case."
      - id: D
        text: "Reviewers should feel the classifier handles posts noticeably better than the version we ship today."
        correct: false
        rationale: "An unanchored impression is not measurable or consistently applied."
    source:
      title: "Define success criteria and build evaluations"
      url: "https://platform.claude.com/docs/en/test-and-evaluate/define-success"
  - id: prod-prompting.D1.S3.q3
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: practitioner
    stem: "A schema lists properties in the order name, notes (optional), email, age (optional). Downstream code reads the JSON fields by position and breaks. Why, and what is the fix?"
    select: 1
    options:
      - id: A
        text: "Property order in structured outputs is random on each request; retry the call until the fields come back in schema order."
        correct: false
        rationale: "Order is not random: the schema's order is kept within the required group and within the optional group."
      - id: B
        text: "Required properties are output first, then optional ones; mark all required, or stop relying on position."
        correct: true
        rationale: "The docs state required properties appear first, followed by optional ones, each in schema order, and suggest making all required or handling the reordering."
      - id: C
        text: "Properties are output in alphabetical order, not schema order; rename them so they sort correctly."
        correct: false
        rationale: "The docs describe schema order with required properties first, not alphabetical order."
      - id: D
        text: "Claude reverses the schema order for objects with optional fields; list the properties backwards."
        correct: false
        rationale: "Nothing reverses the order; the reordering only moves optional properties after required ones."
    source:
      title: "Structured outputs"
      url: "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"
  - id: prod-prompting.D1.S3.q4
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: practitioner
    stem: "A team routes support tickets into five fixed categories and has 1,000 human-labelled tickets. Which grading method should their eval start with?"
    select: 1
    options:
      - id: A
        text: "Human grading of every output by experts, because it is the highest-quality and most scalable option."
        correct: false
        rationale: "Human grading is flexible and high quality but slow and expensive; the guide says to avoid it when possible, and code-based grading is the scalable one."
      - id: B
        text: "An LLM grader scoring each answer on a 1 to 5 Likert scale, as the most reliable option."
        correct: false
        rationale: "The guide rates code-based grading as the most reliable and says to test an LLM grader's reliability first; a fixed category has one right answer that code can check."
      - id: C
        text: "ROUGE-L longest-common-subsequence overlap between the output and the expected label, per ticket."
        correct: false
        rationale: "ROUGE-L is the guide's example for summaries, not single categorical labels."
      - id: D
        text: "Code-based exact match against the labelled category: the fastest and most reliable option."
        correct: true
        rationale: "The guide says to pick the fastest, most reliable, most scalable method; exact match fits clear-cut categorical answers."
    source:
      title: "Define success criteria and build evaluations"
      url: "https://platform.claude.com/docs/en/test-and-evaluate/define-success"
  - id: prod-prompting.D1.S3.q5
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: expert
    stem: "An extraction service uses structured outputs and still, rarely, gets an HTTP 200 whose content does not match the schema. Which response field should its code check first, and for which values?"
    select: 1
    options:
      - id: A
        text: "stop_reason \"end_turn\", which signals Claude abandoned the schema partway through writing the reply."
        correct: false
        rationale: "end_turn is a normal completion, not a sign the schema was abandoned; the stop reasons the docs give for a mismatch are refusal and max_tokens (an enum casing slip has no special stop_reason)."
      - id: B
        text: "stop_reason \"refusal\" (handle it as a refusal) or \"max_tokens\" (retry with a higher max_tokens)."
        correct: true
        rationale: "The docs list two invalid-output cases: a refusal, which returns 200 and may not match the schema, and a max_tokens cut-off, which may leave incomplete output and should be retried with more tokens."
      - id: C
        text: "None: the API reports any schema mismatch as an HTTP 400 error, so a 200 cannot carry one."
        correct: false
        rationale: "A 400 is for invalid schemas or unsupported features; the refusal case returns 200."
      - id: D
        text: "stop_reason \"tool_use\", which means Claude moved the JSON out of its text reply and into a tool call."
        correct: false
        rationale: "tool_use signals a tool call; it is not how structured-output mismatches are reported."
    source:
      title: "Structured outputs"
      url: "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"
  - id: prod-prompting.D1.S3.q6
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: expert
    stem: "A classifier's strict schema has the enum value \"Conversation topic 3\". Sometimes the response contains \"Conversation Topic 3\", with no error and a normal stop_reason. What should the team do?"
    select: 1
    options:
      - id: A
        text: "Treat it as an API bug and retry until the exact string comes back."
        correct: false
        rationale: "It is documented behavior, not a bug; retrying wastes requests."
      - id: B
        text: "Set additionalProperties to true so variant spellings are accepted."
        correct: false
        rationale: "additionalProperties is about extra object keys, and must be false for structured outputs; it has nothing to do with enum casing."
      - id: C
        text: "Compare enum values case-insensitively, and avoid enum values that differ only in capitalization."
        correct: true
        rationale: "The docs say structured outputs do not guarantee the capitalization of enum and const values and recommend case-insensitive comparison."
      - id: D
        text: "Switch from JSON outputs to strict tool use (strict: true), which matches enum values exactly, including case."
        correct: false
        rationale: "The docs say the capitalization caveat applies to both JSON outputs and strict tool use; the documented remedy is case-insensitive comparison."
    source:
      title: "Structured outputs"
      url: "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"
