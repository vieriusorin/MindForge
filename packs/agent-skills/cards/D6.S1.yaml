skill: D6.S1
cards:
  - id: agent-skills.D6.S1.card-symptom-then-fix
    concept: Name the symptom first; each one has its own fix
    origin: ai
    author: sorin.vieriu@ddroidd.com
    level: practitioner
    simply: >-
      Claude decides whether to use a skill from a short listing of skill names and descriptions, and
      once it uses one, the skill's content is added to the conversation when it is invoked. Most skill
      problems trace back to one of those two facts. Say you wrote a skill for writing database
      migrations. If Claude never picks it up when you ask "add a column to users", the description
      probably lacks the words you actually use, so add them (and if it is user-invocable you can still type /skill-name). If
      it loads for unrelated work, make the description more specific, or add
      disable-model-invocation: true to keep it manual. If Claude followed it at first and then
      drifted, reword guidance so it covers the whole task, move a rule that must hold every time
      into a hook, or invoke the skill again after compaction. If you have many skills and some stop
      matching, the listing may be over its budget and descriptions are being cut.
    inNature: >-
      A flower and its pollinators. A bee picks a flower by its scent and colour from across the
      meadow. A flower with no clear signal is passed by; one that smells like everything draws
      insects that have no use for it; and in a crowded meadow the faint scents get lost among the
      strong ones.
    whereItBreaks:
      - "A crowded meadow drowns faint scents at random. When the skill listing exceeds its budget, Claude Code keeps every skill name and drops descriptions starting with the skills you invoke least."
      - "A bee that has visited a flower remembers it. Claude Code doesn't re-read a skill file on later turns, and after compaction it can keep only the start of an invoked skill."
      - "A flower can't make a bee land. You can: type /skill-name to invoke a user-invocable skill directly, or put a rule that must hold every time in a hook, which runs whether or not Claude is following the skill."
    contrast: >-
      A skill that never triggers is a matching problem (description, listing, name, frontmatter,
      paths). A skill that triggers too often is a specificity problem. A skill that is invoked and
      then ignored is a persistence problem (wording, hooks, compaction).
    diagram: agent-skills.D6.S1.diagram-troubleshooting-tree
    sources:
      - https://code.claude.com/docs/en/skills
